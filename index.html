<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanz-Radar</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Finanz-Radar"><meta name="theme-color" content="#ff5a1f">
<style>
:root{--bg:#e9eaec;--p:#fff;--ink:#222;--mut:#8a8d93;--ln:#d5d7db;--or:#ff5a1f;--orl:#ffe9e0;--g:#1f9d63;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--p:#202225;--ink:#eceef0;--mut:#8d9198;--ln:#33363b;--orl:#3a2218;--g:#3ccf8e}}
:root[data-theme="dark"]{--bg:#17181a;--p:#202225;--ink:#eceef0;--mut:#8d9198;--ln:#33363b;--orl:#3a2218;--g:#3ccf8e}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 ui-monospace,"SF Mono",Menlo,Consolas,monospace;padding-bottom:90px;-webkit-text-size-adjust:100%}
.wrap{max-width:520px;margin:0 auto;padding:10px}
.top{display:flex;align-items:center;gap:8px;background:var(--p);border:1px solid var(--ln);padding:8px 10px;font-size:11px;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%}.top b{color:var(--ink)}.sp{flex:1}
.badge{background:var(--or);color:#fff;padding:5px 9px;font-size:11px;letter-spacing:.06em}
.panel{background:var(--p);border:1px solid var(--ln);margin-top:10px;padding:14px;position:relative}
.panel h2{margin:0 0 12px;font-size:11px;font-weight:500;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.hatch{height:9px;margin:12px -14px;background:repeating-linear-gradient(135deg,var(--ln) 0 1px,transparent 1px 5px)}
label{display:block;font-size:10px;letter-spacing:.12em;color:var(--mut);text-transform:uppercase;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:transparent;border:1px solid var(--ln);padding:9px 10px;border-radius:0;min-width:0}
select option{color:#222}
input:focus,select:focus{outline:1px solid var(--or);border-color:var(--or)}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{font:inherit;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:10px 12px;border:1px solid var(--or);background:var(--or);color:#fff;border-radius:0;cursor:pointer;width:100%;margin-top:10px}
.btn.o{background:transparent;color:var(--or)}.x{width:auto;margin:0;padding:3px 9px;border-color:var(--ln);background:transparent;color:var(--mut)}
.k{margin-bottom:8px}.k b{display:block;font-size:24px;font-weight:500;letter-spacing:-.02em}.k.big b{font-size:32px;color:var(--or)}
.k span,.mut{font-size:10px;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:6px;background:var(--ln);margin:5px 0 3px}.bar i{display:block;height:100%;background:var(--or)}
.stk{display:flex;height:10px;margin:8px 0}.stk i{display:block;height:100%}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}
.li small{display:block;color:var(--mut);font-size:10px}
.pos{color:var(--g)}.neg{color:var(--or)}
.nav{display:flex;align-items:center;gap:8px}.nav .btn{margin:0;width:44px}.nav div{flex:1;text-align:center;letter-spacing:.1em}
svg{width:100%;height:auto;display:block}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--p);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{flex:1;font:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:14px 2px;background:transparent;border:0;border-top:2px solid transparent;color:var(--mut);cursor:pointer}
.tabs button.on{color:var(--or);border-top-color:var(--or);background:var(--orl)}
.note{font-size:10px;color:var(--mut);margin:12px 2px}
@keyframes pu{0%{box-shadow:0 0 0 0 rgba(255,90,31,.55)}100%{box-shadow:0 0 0 12px rgba(255,90,31,0)}}
@keyframes pg{0%{box-shadow:0 0 0 0 rgba(40,200,100,.65)}100%{box-shadow:0 0 0 9px rgba(40,200,100,0)}}
@keyframes sh{to{transform:translateX(100%)}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes bl{50%{opacity:.3}}
.badge{animation:pu 2.2s infinite}
.live{width:8px;height:8px;border-radius:50%;background:#28c840;animation:pg 1.6s infinite}
.in .panel{animation:up .4s both}.in .panel:nth-child(2){animation-delay:.06s}.in .panel:nth-child(3){animation-delay:.12s}.in .panel:nth-child(4){animation-delay:.18s}
.bar{overflow:hidden}.bar i{position:relative;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:sh 2.4s infinite}
.stk i{transition:width .9s}.s-crypto{animation:bl 2.4s infinite}
.btn{transition:transform .12s}.btn:active{transform:scale(.96)}
.k.big b{text-shadow:0 0 18px rgba(255,90,31,.25)}
.p{animation:bl 1.4s infinite}
.hide .wrap :is(.k b,.li b,.li>span:last-child,.badge){filter:blur(7px)}
.hd{touch-action:none;cursor:grab;color:var(--mut);padding:2px 8px 2px 0;font-size:15px;user-select:none;-webkit-user-select:none}
.rng{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.rg{font:inherit;font-size:11px;padding:5px 8px;border:1px solid var(--ln);background:transparent;color:var(--mut);border-radius:0}.rg.on{border-color:var(--or);color:var(--or);background:var(--orl)}
svg[data-pts]{touch-action:pan-y;cursor:crosshair}.panel h2{display:flex;align-items:center;gap:6px}.tabs button{letter-spacing:.03em!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="wrap">
<div class="top"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span>Finanz/<b id="ttl">Home</b></span><span class="live"></span><span class="sp"></span><button class="btn x" onclick="hideN()" style="margin-right:6px">◉</button><button class="btn x" id="th" onclick="theme()" style="margin-right:6px">☀</button><span class="badge" id="bd"></span></div>
<div id="v"></div></div>
<div class="tabs" id="tb"></div>
<script>
const $=i=>document.getElementById(i),eur=v=>Math.round(v).toLocaleString('de-DE')+' €',pct=v=>v.toLocaleString('de-DE',{maximumFractionDigits:1})+' %',uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s||'').replace(/[<>&"]/g,'');
const IN=['Gehalt','Nebenjob','Sonstige Einnahmen'],OUT=['Wohnen','Lebensmittel','Mobilität','Freizeit','Versicherung','Abos','Sonstiges','Sparen/Invest'];
const KIND={etf:'ETF',aktie:'Aktien',cash:'Cash',gold:'Gold & Edelmetalle',immo:'Immobilien',sonst:'Sonstiges',crypto:'Krypto'},COL={etf:'var(--ink)',aktie:'#5b6cff',cash:'var(--mut)',gold:'#d4a017',immo:'#1f9d63',sonst:'#9b59b6',crypto:'var(--or)'};
let yr='';let S={tx:[],as:[],goals:[],rec:[],debts:[],hist:[],sales:[],ui:{c:{},o:{}},th:'light',f:{wr:4,exp:'',r:6}},tab='home',mo=new Date().toISOString().slice(0,7),mem=null;
try{const j=localStorage.getItem('fr_s');if(j)S=Object.assign(S,JSON.parse(j))}catch(e){}
// ==== Supabase (URL + Publishable/anon Key aus Supabase -> Project Settings -> API eintragen) ====
const SB_URL='',SB_KEY='';
const sb=(SB_URL&&SB_KEY&&window.supabase)?window.supabase.createClient(SB_URL,SB_KEY):null;
let user=null,syncMsg='',tmr=null,authReady=!sb;
function localSave(){try{localStorage.setItem('fr_s',JSON.stringify(S))}catch(e){}}
function save(){localSave();if(sb&&user){clearTimeout(tmr);tmr=setTimeout(push,1500)}}
async function push(){if(!sb||!user)return;const ts=Date.now();S.ts=ts;localSave();const{error}=await sb.from('finance_state').upsert({user_id:user.id,data:S,updated_at:new Date(ts).toISOString()});syncMsg=error?'Fehler: '+error.message:'Synchronisiert '+new Date().toLocaleTimeString('de-DE')}
async function pull(auto){if(!sb||!user)return;const{data,error}=await sb.from('finance_state').select('data,updated_at').eq('user_id',user.id).maybeSingle();if(error){syncMsg='Fehler: '+error.message;return render()}
const ct=data?new Date(data.updated_at).getTime():0;if(data&&(ct>(S.ts||0)||!auto)){S={...S,...data.data,ts:ct};localSave();syncMsg='Aus Cloud geladen'}else{await push()}render()}
async function initAuth(){if(!sb)return;try{const{data}=await sb.auth.getSession();user=data.session?data.session.user:null;sb.auth.onAuthStateChange((_e,ses)=>{const u=ses?ses.user:null,was=user;user=u;if(u&&!was)setTimeout(()=>pull(true),0);else render()});if(user)await pull(true)}catch(e){syncMsg=String(e.message||e)}authReady=true;render()}
async function login(up){const e=$('le').value.trim(),p=$('lp').value;if(!e||p.length<6){syncMsg='E-Mail und Passwort (mind. 6 Zeichen) eingeben';return render()}
const r=up?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});syncMsg=r.error?r.error.message:(up&&!(r.data&&r.data.session)?'Bestätigungs-Mail gesendet: bitte bestätigen, dann anmelden':'');render()}
async function logout(){await sb.auth.signOut();user=null;render()}
function applyTh(){const t=S.th||'light';if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=t;document.body.classList.toggle('hide',!!S.hide);const b=$('th');if(b)b.textContent=t==='light'?'☀':t==='dark'?'☾':'◐'}
function hideN(){S.hide=!S.hide;save();applyTh()}
function cu(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;document.querySelectorAll('.k.big b').forEach(e=>{const m=e.textContent.match(/^(-?[\d.]+) €$/);if(!m)return;const to=parseInt(m[1].replace(/\./g,''),10),s0=performance.now();(function f(n){const p=Math.min(1,(n-s0)/700);e.textContent=Math.round(to*(1-Math.pow(1-p,3))).toLocaleString('de-DE')+' €';if(p<1)requestAnimationFrame(f)})(s0)})}
function theme(){S.th={light:'dark',dark:'auto',auto:'light'}[S.th||'light'];save();applyTh()}
const P=(t,h)=>{const id=esc(tab+':'+((t.match(/^\[([^\]]+)\]/)||[0,t])[1])),c=S.ui&&S.ui.c[id];return `<div class="panel" data-pk="${id}"><h2><span class="hd" data-pn="1">⠿</span><span style="flex:1;cursor:pointer" onclick="tg('${id}')">${t}</span><span class="mut" style="cursor:pointer" onclick="tg('${id}')">${c?'▸':'▾'}</span></h2>${c?'':h}</div>`},N=i=>{const v=parseFloat(String($(i).value).replace(',','.'));return isFinite(v)?v:0};
const mt=()=>S.tx.filter(x=>x.d.startsWith(mo)),sm=(l,t)=>l.filter(x=>IN.includes(x.c)===(t==='in')&&(t==='in'||x.c!=='Sparen/Invest')).reduce((s,x)=>s+x.a,0);
const val=a=>a.q*a.p,dt=()=>S.debts.reduce((s,d)=>s+d.a,0),nw=()=>S.as.reduce((s,a)=>s+val(a),0),nn=()=>nw()-dt(),fireF=()=>((parseFloat(S.f.exp)||avg().o)*12)/(S.f.wr/100),gv=g=>({nw:nn(),cash:byK('cash'),etf:byK('etf'),crypto:byK('crypto')}[g.m]??g.c),bk=()=>`<button class="btn o" style="margin:0" onclick="tab='more';render();scrollTo(0,0)">‹ Mehr</button>`,byK=k=>S.as.filter(a=>a.k===k).reduce((s,a)=>s+val(a),0);
function avg(){const ms=[...new Set(S.tx.map(x=>x.d.slice(0,7)))];if(!ms.length)return{i:0,o:0,s:0};let i=0,o=0;ms.forEach(m=>{const l=S.tx.filter(x=>x.d.startsWith(m));i+=sm(l,'in');o+=sm(l,'out')});return{i:i/ms.length,o:o/ms.length,s:(i-o)/ms.length}}
function bars(l,t){const c={};l.filter(x=>IN.includes(x.c)===(t==='in')).forEach(x=>c[x.c]=(c[x.c]||0)+x.a);const T=Object.values(c).reduce((a,b)=>a+b,0)||1;return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="li" style="display:block"><div style="display:flex;justify-content:space-between"><span>${k}</span><b>${eur(v)}</b></div><div class="bar"><i style="width:${v/T*100}%"></i></div><span class="mut">${pct(v/T*100)}</span></div>`).join('')||'<span class="mut">Keine Einträge</span>'}
function moNav(){const[y,m]=mo.split('-');return`<div class="nav"><button class="btn o" onclick="sh(-1)">‹</button><div>${new Date(y,m-1).toLocaleDateString('de-DE',{month:'long',year:'numeric'}).toUpperCase()}</div><button class="btn o" onclick="sh(1)">›</button></div>`}
function sh(d){const[y,m]=mo.split('-').map(Number),n=new Date(y,m-1+d,1);mo=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');render()}
function del(k,id){S[k]=S[k].filter(x=>x.id!==id);save();render()}
function applyRec(){S.rec.forEach(r=>{if(!S.tx.some(x=>x.r===r.id&&x.d.startsWith(mo)))S.tx.push({id:uid(),d:mo+'-01',c:r.c,a:r.a,n:r.n,r:r.id})});save();render()}
function copyMo(){const[y,m]=mo.split('-').map(Number),pm=new Date(y,m-2,1),k=pm.getFullYear()+'-'+String(pm.getMonth()+1).padStart(2,'0');S.tx.filter(x=>x.d.startsWith(k)).forEach(x=>{if(!S.tx.some(z=>z.d.startsWith(mo)&&z.c===x.c&&z.a===x.a&&z.n===x.n))S.tx.push({...x,id:uid(),d:mo+x.d.slice(7)})});save();render()}
function addDebt(){const a=N('da'),n=esc($('dn').value);if(!n||!(a>0))return;S.debts.push({id:uid(),n,a});save();render()}
function setP(id,v){const a=S.as.find(x=>x.id===id);if(a){a.p=parseFloat(String(v).replace(',','.'))||0;save();render()}}
const debtsHTML=()=>P('[Schulden] '+eur(dt()),S.debts.map(d=>`<div class="li" data-k="debts" data-id="${d.id}"><span><span class="hd">⠿</span>${d.n}</span><span class="neg">${eur(d.a)} <button class="btn x" onclick="ed={k:'debts',id:'${d.id}'};render();scrollTo(0,0)">✎</button> <button class="btn x" onclick="del('debts','${d.id}')">×</button></span></div>`).join('')+`<div class="row" style="margin-top:8px"><input id="dn" placeholder="Bezeichnung"><input id="da" type="number" inputmode="decimal" placeholder="Betrag €"></div><button class="btn o" onclick="addDebt()">Schuld hinzufügen</button>`);
const kzHTML=()=>{const F=fireF(),n=nn();return P('[Kennzahlen]',[['Assets',eur(nw())],['Schulden',eur(dt())],['Net Worth',eur(n)],['Liquidität',eur(byK('cash'))],['Realisierte G/V',eur(S.real||0)],['FIRE Fortschritt',pct(F?n/F*100:0)]].filter(r=>!['Schulden','Liquidität','Realisierte G/V'].includes(r[0])||r[1]!=='0 €').map(([a,b])=>`<div class="li"><span class="mut">${a}</span><b>${b}</b></div>`).join(''))};
function sankey(l){const cs={},os={};let inv=0;l.forEach(x=>{if(IN.includes(x.c))cs[x.c]=(cs[x.c]||0)+x.a;else if(x.c==='Sparen/Invest')inv+=x.a;else os[x.c]=(os[x.c]||0)+x.a});
const I=Object.entries(cs).sort((a,b)=>b[1]-a[1]),O=Object.entries(os).sort((a,b)=>b[1]-a[1]),si=I.reduce((s,e)=>s+e[1],0),so=O.reduce((s,e)=>s+e[1],0)+inv;
if(!si&&!so)return '<span class="mut">Keine Daten in diesem Monat</span>';
const Lf=I.map(e=>({n:e[0],v:e[1],c:'var(--g)'}));if(so>si)Lf.push({n:'Defizit',v:so-si,c:'#ff4d6d'});
const Rt=O.map(e=>({n:e[0],v:e[1],c:'var(--or)'}));if(inv)Rt.push({n:'Sparen/Invest',v:inv,c:'var(--ink)'});if(si>so)Rt.push({n:'Überschuss',v:si-so,c:'var(--g)'});
const T=Math.max(si,so),g=7,m=Math.max(Lf.length,Rt.length),H=Math.max(170,m*30),k=(H-g*(m-1))/T;
let y=0;Lf.forEach(n=>{n.y=y;n.h=n.v*k;n.u=0;y+=n.h+g});y=0;Rt.forEach(n=>{n.y=y;n.h=n.v*k;n.u=0;y+=n.h+g});
[Lf,Rt].forEach(c=>{let p=-99;c.forEach(n=>{n.ly=Math.max(n.y+n.h/2+3,p+11);p=n.ly})});const xl=100,xr=260;let rb='',nd='';
Lf.forEach(a=>Rt.forEach(b=>{const w=a.v*b.v/T*k,y0=a.y+a.u+w/2,y1=b.y+b.u+w/2;a.u+=w;b.u+=w;rb+=`<path d="M${xl} ${y0}C180 ${y0},180 ${y1},${xr} ${y1}" fill="none" stroke="${b.c}" stroke-opacity=".3" stroke-width="${Math.max(.5,w)}"/>`}));
const lb=(n,x,an)=>`<text x="${x}" y="${n.ly}" font-size="9" text-anchor="${an}" fill="var(--ink)">${n.n.slice(0,10)} ${eur(n.v)}</text>`;
Lf.forEach(n=>nd+=`<rect x="${xl-6}" y="${n.y}" width="6" height="${Math.max(1,n.h)}" fill="${n.c}"/>`+lb(n,xl-10,'end'));
Rt.forEach(n=>nd+=`<rect x="${xr}" y="${n.y}" width="6" height="${Math.max(1,n.h)}" fill="${n.c}"/>`+lb(n,xr+10,'start'));
return `<svg viewBox="0 0 360 ${Math.max(H,Lf[Lf.length-1].ly+8,Rt[Rt.length-1].ly+8)}">${rb}${nd}</svg>`}
function addTx(){const a=N('ta');if(!(a>0))return;const c=$('tc').value,rid=$('tr').checked?uid():null,nt=esc($('tn').value);S.tx.push({id:uid(),d:$('td').value||mo+'-01',c,a,n:nt,r:rid});if(rid)S.rec.push({id:rid,c,a,n:nt,e:false});save();render()}
function snap(){if(!S.as.length&&!S.debts.length)return;const m=new Date().toISOString().slice(0,7),v=Math.round(nn()),e=S.hist.find(x=>x.m===m);if(!e){S.hist.push({id:uid(),m,nw:v});save()}else if(!e.man&&e.nw!==v){e.nw=v;save()}}
function addHist(){const m=$('hm').value,v=parseFloat($('hv').value);if(!m||!isFinite(v))return;const e=S.hist.find(x=>x.m===m);if(e){e.nw=v;e.man=1}else S.hist.push({id:uid(),m,nw:v,man:1});save();render()}
const histHTML=()=>{const H=S.hist.slice().sort((a,b)=>a.m.localeCompare(b.m));let h='';
if(H.length>=2){const vs=H.map(x=>x.nw),mn=Math.min(...vs),mx=Math.max(...vs),r=(mx-mn)||1,X=i=>44+306*i/(H.length-1),Y=v=>110-96*(v-mn)/r,lab=v=>Math.abs(v)>=1e6?(v/1e6).toFixed(1).replace('.',',')+' M':Math.round(v/1000)+' T',col=vs[vs.length-1]>=vs[0]?'var(--g)':'var(--or)';
h+=`<svg viewBox="0 0 360 140" data-pts='${JSON.stringify(H.map(x=>[x.m,x.nw]))}' data-names="Net Worth" data-x0="44" data-x1="350" data-top="14" data-bot="110" data-min="${mn}" data-max="${mn+r}">`+[0,.5,1].map(q=>{const v=mn+r*q,yy=Y(v);return `<line x1="44" x2="352" y1="${yy}" y2="${yy}" stroke="var(--ln)"/><text x="40" y="${yy+3}" font-size="8" text-anchor="end" fill="var(--mut)">${lab(v)}</text>`}).join('')+`<path d="${H.map((x,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(x.nw).toFixed(1)).join('')}" fill="none" stroke="${col}" stroke-width="2"/>`+H.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.nw)}" r="${i===H.length-1?4:2.5}" fill="${col}">${i===H.length-1?'<animate attributeName="r" values="3;6;3" dur="1.8s" repeatCount="indefinite"/>':''}</circle>`).join('')+`<text x="44" y="132" font-size="8" fill="var(--mut)">${H[0].m}</text><text x="352" y="132" font-size="8" text-anchor="end" fill="var(--mut)">${H[H.length-1].m}</text></svg>`;
const d=vs[vs.length-1]-vs[0];h+=`<div class="${d>=0?'pos':'neg'}">${d>=0?'+':''}${eur(d)} seit ${H[0].m}</div>`}
else h+='<span class="mut">Der Verlauf entsteht automatisch: ein Punkt pro Monat. Ältere Stände kannst du unten nachtragen.</span>';
